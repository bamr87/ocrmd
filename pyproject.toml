[project]
name = "ocrmd"
version = "0.1.1"
description = "Scan physical books and pages into cross-checked Markdown, text and JSON, with an inventory of everything scanned"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  # The KleidiCV HAL segfaults in cv2.resize on some page crops (arm64 macOS, measured). It was first
  # hit on opencv 5.0.0.93 and pinned out with `<5` — but KleidiCV ships in 4.12+ as well, and 4.14
  # crashes the same way on the wider crops this pipeline now produces. 4.11.0.86 is the last release
  # with no KleidiCV at all (`getBuildInformation()` lists the custom HALs); keep below 4.12.
  "opencv-python>=4.9,<4.12", "numpy>=1.26", "anthropic>=1.0", "pydantic>=2", "rapidfuzz", "pyyaml", "typer>=0.12",
  "python-dotenv", "pillow", "fastapi>=0.110", "uvicorn>=0.27", "python-multipart",
  "pyobjc-framework-Vision; sys_platform == 'darwin'", "pyobjc-framework-AVFoundation; sys_platform == 'darwin'",
]

[project.optional-dependencies]
rapidocr = ["rapidocr>=3.0", "onnxruntime>=1.20"]   # PP-OCR on ONNX Runtime: second engine on macOS, the primary elsewhere
tesseract = ["pytesseract"]     # last-resort engine (needs the tesseract binary); weak on camera images
pdf = ["pymupdf"]               # `ocrmd ingest file.pdf`
# `ocrmd etl` needs nothing extra — the operators run on ocrmd's own provider. This installs DocETL
# itself, for running an exported pipeline (`ocrmd etl --export-docetl out/ && docetl run out/pipeline.yaml`)
# through their optimizer. It is a large install (litellm, modal, pandas, scikit-learn, ...).
docetl = ["docetl>=0.3"]
dev = ["pytest>=8", "ruff>=0.5", "httpx"]   # httpx: FastAPI's TestClient

[project.urls]
Homepage = "https://github.com/bamr87/ocrmd"
Changelog = "https://github.com/bamr87/ocrmd/blob/main/CHANGELOG.md"

[project.scripts]
ocrmd = "ocrmd.cli:app"

# Destinations written in Python register here (see ocrmd/sinks.py): a callable taking the Settings and
# returning an object with `name`, `describe()` and `send(envelope, options)`. HTTP receivers need no code —
# a `[[sinks]]` table in ocrmd.toml is enough. ocrmd itself ships none; the group exists for host packages.
[project.entry-points."ocrmd.sinks"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ocrmd*"]

[tool.setuptools.package-data]
"ocrmd.web" = ["static/*"]
"ocrmd" = ["pipelines/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E401", "E501", "E701", "E702", "E731", "B008"]   # compact imports/one-liners are deliberate; B008 is the typer idiom
