name: ci
on: [push, pull_request]
jobs:
  test:
    # Apple Vision (pyobjc) and AVFoundation are macOS-only; the pipeline tests need a local OCR engine.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e '.[dev,rapidocr]'
      - run: ruff check ocrmd tests
      - run: pytest -q
